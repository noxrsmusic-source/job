<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Service Details — Nexoral</title>
<meta name="description" content="Detailed overview of Nexoral's services: scope, workflow, deliverables, industries and FAQs.">
<link rel="canonical" href="https://www.example.com/service-details.html">
<meta property="og:title" content="Service Details — Nexoral">
<meta property="og:type" content="website">
<link rel="icon" href="assets/logos/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div class="page-loader"><div class="loader-ring"></div></div>
<a class="skip-link" href="#main">Skip to main content</a>

<main id="main">
  <section class="page-hero">
    <div class="hero-bg" aria-hidden="true"><span class="orb orb-1"></span><span class="orb orb-2"></span><span class="grid-overlay"></span></div>
    <div class="container page-hero-inner" id="serviceHero">
      <nav class="breadcrumb" aria-label="Breadcrumb">
        <a href="index.html">Home</a><span>/</span><a href="services.html">Services</a><span>/</span><span id="crumb">Details</span>
      </nav>
      <h1 id="serviceTitle">Loading service…</h1>
      <p id="serviceIntro"></p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div id="serviceBody">
        <div class="skeleton skeleton-card" style="height:400px"></div>
      </div>
    </div>
  </section>
</main>

<script type="module">
  import { getService } from "./js/services.js";
  import { esc, observeReveal, initAccordions, toast } from "./js/main.js";

  const slug = new URLSearchParams(location.search).get("s");
  const svc  = getService(slug);
  const hero = document.getElementById("serviceHero");
  const body = document.getElementById("serviceBody");

  if (!svc) {
    document.getElementById("serviceTitle").textContent = "Service not found";
    document.getElementById("crumb").textContent = "Not found";
    body.innerHTML = `
      <div class="empty-state">
        <h3>We couldn't find that service</h3>
        <p>It may have been renamed or the link is incorrect. Browse all capabilities instead.</p>
        <a class="btn btn-primary" href="services.html">View All Services</a>
      </div>`;
    toast("Service not found.", "warn");
  } else {
    document.title = `${svc.title} — Nexoral`;
    document.getElementById("crumb").textContent = svc.title;
    document.getElementById("serviceTitle").innerHTML =
      `${esc(svc.title)}`;
    document.getElementById("serviceIntro").textContent = svc.short;

    body.innerHTML = `
      <div class="detail-layout">
        <div class="prose" data-reveal>
          <h2>Service Overview</h2>
          <p>${esc(svc.overview)}</p>

          <h2>What We Provide</h2>
          <ul>${svc.provides.map(i => `<li>${esc(i)}</li>`).join("")}</ul>

          <h2>Typical Workflow</h2>
          <ol>${svc.workflow.map(i => `<li>${esc(i)}</li>`).join("")}</ol>

          <h2>Deliverables</h2>
          <ul>${svc.deliverables.map(i => `<li>${esc(i)}</li>`).join("")}</ul>

          <h2>Industries &amp; Use Cases</h2>
          <div class="card-tags">${svc.industries.map(i => `<span class="tag">${esc(i)}</span>`).join("")}</div>

          <h2>Why Choose This Service</h2>
          <ul>${svc.why.map(i => `<li>${esc(i)}</li>`).join("")}</ul>

          <h2>Frequently Asked Questions</h2>
          <div class="accordion">
            ${svc.faq.map((f, i) => `
              <div class="acc-item">
                <button class="acc-btn" type="button" aria-expanded="false">
                  ${esc(f.q)}<span class="ai" aria-hidden="true"></span>
                </button>
                <div class="acc-body"><div class="acc-body-inner">${esc(f.a)}</div></div>
              </div>`).join("")}
          </div>
        </div>

        <aside class="aside-card" data-reveal data-reveal-delay="100">
          <h4>Service Summary</h4>
          <div class="aside-list">
            <div><span>Category</span><span>${esc(svc.title)}</span></div>
            <div><span>Engagement</span><span>Project / Retainer</span></div>
            <div><span>Team</span><span>Senior-led</span></div>
            <div><span>Revisions</span><span>2 rounds included</span></div>
          </div>
          <a class="btn btn-primary btn-block" href="hire-us.html?s=${encodeURIComponent(svc.slug)}">Discuss Your Project</a>
          <a class="btn btn-ghost btn-block" href="services.html">Back to All Services</a>
        </aside>
      </div>`;

    observeReveal(body);
    initAccordions(body);
  }
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
